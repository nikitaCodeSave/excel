[project]
name = "excel-ai-processor"
version = "1.0.0"
description = "AI-powered Excel/CSV processor with PydanticAI"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.120.0",
    "uvicorn[standard]>=0.38.0",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "pydantic-ai>=1.6.0",
    "httpx>=0.28.1",
    "pandas>=2.3.0",
    "numpy>=2.3.4",
    "openpyxl>=3.1.5",
    "matplotlib>=3.10.7",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
